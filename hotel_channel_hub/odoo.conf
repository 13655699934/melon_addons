[options]
# 数据库配置
db_host = postgres
db_port = 5432
db_user = odoo
db_password = odoo
db_maxconn = 64
db_name = False
db_template = template0

# 模块路径
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons

# HTTP 配置
http_port = 8069
http_interface = 0.0.0.0
proxy_mode = True

# Longpolling
gevent_port = 8072

# 日志配置
logfile = False
log_level = info
log_handler = :INFO

# Worker 配置（生产环境）
workers = 2
max_cron_threads = 1

# 限制
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_request = 8192
limit_time_cpu = 600
limit_time_real = 1200

# 国际化
without_demo = False
# 使用中文
lang = zh_CN

# 安全
admin_passwd = admin
list_db = True

# 其他
csv_internal_sep = ,
reportgz = False
server_wide_modules = base,web

# 开发模式（生产环境请删除）
dev_mode = reload,qweb,werkzeug,xml

